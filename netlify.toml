# Netlify Configuration for Next.js 14 App Router

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  DATABASE_URL = "file:./prisma/dev.db"
  JWT_SECRET = "knotandbloom-luxury-secret-key-super-secure-2026"
  NEXTAUTH_SECRET = "knotandbloom-luxury-secret-key-super-secure-2026"
  NEXT_PUBLIC_APP_URL = "https://knotndbloom.netlify.app"

[functions.environment]
  DATABASE_URL = "file:./prisma/dev.db"
  JWT_SECRET = "knotandbloom-luxury-secret-key-super-secure-2026"
  NEXTAUTH_SECRET = "knotandbloom-luxury-secret-key-super-secure-2026"
  NEXT_PUBLIC_APP_URL = "https://knotndbloom.netlify.app"

[functions]
  included_files = ["prisma/dev.db", "prisma/**", "lib/catalog-static.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
